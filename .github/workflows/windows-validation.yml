name: Windows Validation - Storage Cause
on:
  workflow_dispatch:
  push:
    branches:
      - validation/gui-e2e-20261013
permissions:
  contents: read
jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests and unsigned Windows validation packaging
        shell: pwsh
        run: .\build-windows-validation.ps1
      - name: Noninteractive Windows GUI startup smoke
        shell: pwsh
        run: .\smoke-windows-validation.ps1
      - name: Record unsigned validation manifest (artifact quota workaround)
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path dist-validation -Recurse -Filter validation-manifest.json | Select-Object -First 1
          if (-not $manifest) { throw "validation-manifest.json was not generated" }
          $result = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
          @(
            "### Windows validation build",
            "- Product: $($result.product)",
            "- SHA256: $($result.sha256)",
            "- Automated tests and unsigned EXE build: succeeded",
            "- GUI process startup: $($result.gui_process_smoke_tested) (noninteractive)",
            "- Automated GUI widget selection, output, negative cases: $($result.automated_gui_e2e_pass)",
            "- Human GUI/manual rendering/accessibility: NOT TESTED",
            "- Signed: false; sales release: false",
            "- Artifact upload: disabled because repository storage quota is exceeded",
            "- Binaries are ephemeral in GitHub Actions and cannot be downloaded from this run"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

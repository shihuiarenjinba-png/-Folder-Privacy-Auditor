name: Windows Validation - Storage Cause
on:
  workflow_dispatch:
  push:
    branches:
      - validation/msix-install-lifecycle-20261013
permissions:
  contents: read
jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests and unsigned Windows validation packaging
        shell: pwsh
        run: .\build-windows-validation.ps1
      - name: Noninteractive Windows GUI startup smoke
        shell: pwsh
        run: .\smoke-windows-validation.ps1
      - name: Validate package SHA256, Authenticode and QA evidence
        shell: pwsh
        run: .\qa\windows-acceptance.ps1 -Mode CI
      - name: Build and verify unsigned TEST-IDENTITY MSIX prototype
        shell: pwsh
        run: .\qa\build-msix-preflight.ps1 -TestIdentity
      - name: Test signed MSIX install update and cleanup on ephemeral runner
        shell: pwsh
        run: .\qa\msix-install-lifecycle-ci.ps1 -EphemeralRunner
      - name: Record unsigned validation manifest (artifact quota workaround)
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path dist-validation -Recurse -Filter validation-manifest.json | Select-Object -First 1
          if (-not $manifest) { throw "validation-manifest.json was not generated" }
          $result = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
          @(
            "### Windows validation build",
            "- Product: $($result.product)",
            "- SHA256: $($result.sha256)",
            "- Automated tests and unsigned EXE build: succeeded",
            "- GUI process startup: $($result.gui_process_smoke_tested) (noninteractive)",
            "- Automated GUI actions/output and negative test: $($result.automated_gui_e2e_pass)",
            "- Human-driven GUI/visual/accessibility: NOT TESTED",
            "- Distribution SHA256 inventory and Authenticode evidence: collected (NOT release clearance)",
            "- QA MSIX pack/unpack hash: PASS if preceding step succeeded (synthetic identity only)",
            "- MSIX signed/installed/Store certified: NOT TESTED",
            "- Signed: false; sales release: false",
            "- Artifact upload: disabled because repository storage quota is exceeded",
            "- Binaries are ephemeral in GitHub Actions and cannot be downloaded from this run"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
